
name: Build CloudStream Plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build CloudStream plugin
        run: gradle make makePluginsJson --no-daemon

      - name: Publish CloudStream repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/cloudstream-builds

          find FilmKaynak/build -type f -name '*.cs3' \
            -exec cp {} /tmp/cloudstream-builds/ \;

          cp build/plugins.json /tmp/cloudstream-builds/
          cp repo.json /tmp/cloudstream-builds/

          cd /tmp/cloudstream-builds

          git init -b builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "Build ${GITHUB_SHA}"

          git remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git push --force origin builds
